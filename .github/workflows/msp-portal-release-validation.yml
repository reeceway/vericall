name: MSP Portal Release Validation

on:
  push:
    paths:
      - "backend/**"
      - "twilio_voice_service/**"
      - "release/MSP_TEST_AND_RELEASE_RUNBOOK.md"
      - ".github/workflows/msp-portal-release-validation.yml"
  pull_request:
    paths:
      - "backend/**"
      - "twilio_voice_service/**"
      - "release/MSP_TEST_AND_RELEASE_RUNBOOK.md"
      - ".github/workflows/msp-portal-release-validation.yml"
  schedule:
    - cron: "0 12 * * *"
  workflow_dispatch:
    inputs:
      run_staging_smoke:
        description: "Run the live staging MSP smoke flow after the local regression jobs"
        required: false
        default: false
        type: boolean
      owner_phone:
        description: "MSP owner phone for the dedicated staging smoke tenant"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: msp-portal-release-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  portal-regression:
    name: Portal Regression
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: twilio_voice_service
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Twilio voice service dependencies
        run: pip install -r requirements.txt

      - name: Run MSP lifecycle regression
        run: python scripts/test_portal_msp_sms_lifecycle.py

      - name: Run account deletion regression
        run: python scripts/test_account_deletion_flow.py

      - name: Run call usage and overage regression
        run: python scripts/test_call_usage_tracking.py

      - name: Run 10,000-user scale gate
        run: python scripts/test_msp_10000_user_scale.py

      - name: Run 10-MSP acceptance gate
        env:
          VICALL_MSP_SMOKE_BASE_URL: http://127.0.0.1:8091
          VICALL_MSP_SMOKE_ADMIN_KEY: test-admin-key
          VICALL_MSP_SMOKE_OTP_SECRET: staging-ops-secret
        run: |
          set -o pipefail
          python scripts/msp_browser_test_harness.py > /tmp/msp-10-harness.log 2>&1 &
          HARNESS_PID=$!
          trap 'kill "$HARNESS_PID" >/dev/null 2>&1 || true' EXIT
          for _ in $(seq 1 30); do
            if curl -fsS "$VICALL_MSP_SMOKE_BASE_URL/health" >/dev/null; then
              READY=1
              break
            fi
            sleep 1
          done
          test "${READY:-}" = "1" || { cat /tmp/msp-10-harness.log; exit 1; }
          python scripts/smoke_test_10_msps.py --msps 10 --concurrency 5 | tee /tmp/msp-10-smoke.json

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: twilio_voice_service/browser_tests/package-lock.json

      - name: Install browser test dependencies
        working-directory: twilio_voice_service/browser_tests
        run: npm ci

      - name: Install Playwright Chromium
        working-directory: twilio_voice_service/browser_tests
        run: npx playwright install --with-deps chromium

      - name: Run browser release matrix
        working-directory: twilio_voice_service/browser_tests
        run: npx playwright test

      - name: Upload Playwright failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: msp-portal-playwright-results
          path: |
            twilio_voice_service/browser_tests/test-results
            twilio_voice_service/browser_tests/playwright-report

      - name: Upload 10-MSP smoke artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: msp-10-smoke-output
          path: |
            /tmp/msp-10-smoke.json
            /tmp/msp-10-harness.log

  staging-smoke:
    name: Staging Smoke
    runs-on: ubuntu-latest
    needs: portal-regression
    if: github.event_name == 'workflow_dispatch' && inputs.run_staging_smoke
    environment: msp-staging
    defaults:
      run:
        working-directory: twilio_voice_service
    env:
      VICALL_MSP_SMOKE_BASE_URL: ${{ secrets.VICALL_STAGING_MSP_BASE_URL }}
      VICALL_MSP_SMOKE_ADMIN_KEY: ${{ secrets.VICALL_STAGING_ADMIN_API_KEY }}
      VICALL_MSP_SMOKE_OWNER_PHONE: ${{ inputs.owner_phone }}
      VICALL_MSP_SMOKE_OTP_FETCH_URL: ${{ format('{0}/_ops/staging/otp/latest', secrets.VICALL_STAGING_MSP_BASE_URL) }}
      VICALL_MSP_SMOKE_OTP_SECRET: ${{ secrets.VICALL_STAGING_MSP_OTP_SECRET }}
      VICALL_MSP_SMOKE_OTP_TIMEOUT_SECONDS: "90"
      VICALL_MSP_SMOKE_SEAT_PRICE_CENTS: ${{ secrets.VICALL_STAGING_MSP_SEAT_PRICE_CENTS }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate staging smoke inputs
        run: |
          test -n "$VICALL_MSP_SMOKE_BASE_URL" || { echo "Missing VICALL_STAGING_MSP_BASE_URL secret"; exit 1; }
          test -n "$VICALL_MSP_SMOKE_ADMIN_KEY" || { echo "Missing VICALL_STAGING_ADMIN_API_KEY secret"; exit 1; }
          test -n "$VICALL_MSP_SMOKE_OWNER_PHONE" || { echo "Provide owner_phone when dispatching this workflow"; exit 1; }
          test -n "$VICALL_MSP_SMOKE_OTP_SECRET" || { echo "Missing VICALL_STAGING_MSP_OTP_SECRET secret"; exit 1; }

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Twilio voice service dependencies
        run: pip install -r requirements.txt

      - name: Run staging MSP smoke flow
        run: |
          set -o pipefail
          python scripts/smoke_test_msp_lifecycle.py | tee /tmp/msp-staging-smoke.json

      - name: Upload staging smoke output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: msp-staging-smoke-output
          path: /tmp/msp-staging-smoke.json
